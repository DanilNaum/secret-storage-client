syntax = "proto3";

package secretstorage;

option go_package = "github.com/DanilNaum/secret-storage-client/pkg/proto";

// Authentication and user management
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// Record management with streaming support for files
service RecordService {
  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  
  // Streaming methods for file operations
  rpc UploadFile(stream FileUploadRequest) returns (FileUploadResponse);
  rpc DownloadFile(FileDownloadRequest) returns (stream FileDownloadResponse);
}

// Authentication messages
message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  string auth_token = 3;
  string salt = 4;
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateResponse {
  bool success = 1;
  string message = 2;
  string auth_token = 3;
  string salt = 4;
}

message LogoutRequest {
  string auth_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// Record messages with oneof for content types
message Record {
  string server_id = 1;
  string name = 2;
  
  oneof content {
    CredentialsData credentials = 3;
    TextData text_data = 4;
    FileData file_data = 5;
  }
}

message CredentialsData {
  string username = 1;
  string password = 2;
}

message TextData {
  string text_content = 1;
}

message FileData {

}

message ServerRecord {
  string id = 1;
  string name = 2;
  RecordType type = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

enum RecordType {
  CREDENTIALS = 0;
  TEXT_DATA = 1;
  FILE = 2;
}

message CreateRecordRequest {
  string auth_token = 1;
  Record record = 2;
}

message CreateRecordResponse {
  bool success = 1;
  string message = 2;
  string server_id = 3;
}

message GetRecordRequest {
  string auth_token = 1;
  string server_id = 2;
}

message GetRecordResponse {
  bool success = 1;
  string message = 2;
  Record record = 3;
}

message UpdateRecordRequest {
  string auth_token = 1;
  Record record = 2;
}

message UpdateRecordResponse {
  bool success = 1;
  string message = 2;
}

message DeleteRecordRequest {
  string auth_token = 1;
  string server_id = 2;
}

message DeleteRecordResponse {
  bool success = 1;
  string message = 2;
}

message ListRecordsRequest {
  string auth_token = 1;
}

message ListRecordsResponse {
  bool success = 1;
  string message = 2;
  repeated ServerRecord records = 3;
}

message GetServerRecordsRequest {
  string auth_token = 1;

}

message GetServerRecordsResponse {
  bool success = 1;
  string message = 2;
  repeated ServerRecord server_records = 3;
}

// File streaming messages
message FileUploadRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileMetadata {
  string record_id = 1;
  string filename = 2;
  int64 file_size = 3;
  string content_type = 4;
}


message FileUploadResponse {
  bool success = 1;
  string message = 2;
}

message FileDownloadRequest {
  string auth_token = 1;
  string record_id = 2;
}

message FileDownloadResponse {
  oneof data {
    FileMetadata info = 1;
    bytes chunk = 2;
  }
}

